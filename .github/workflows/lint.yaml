name: Lint

on:
  push:
    branches:
      - main
    paths:
      - '**/*.sh'
      - '**/*.py'
  pull_request:
    paths:
      - '**/*.sh'
      - '**/*.py'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck -x $(find . -name '*.sh')

  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pschmitt/ci-workflows/.github/actions/python-ruff@main
        with:
          python-version: '3.x'
